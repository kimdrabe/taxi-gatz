media:
  - name: uploads
    label: Uploads
    input: public/uploads
    output: /uploads
    rename: safe
    categories: [image]

content:

  - name: seo
    label: "SEO Einstellungen"
    type: file
    path: src/data/site.json
    format: json
    view:
      primary: site_title
    fields:
      - name: site_title
        label: "Seitentitel (für Startseite)"
        type: string
        description: "Erscheint als erster Eintrag in den Google-Suchergebnissen. Sollte Hauptkeyword + Ortsname enthalten. Max. 60 Zeichen."
        hint: "Wichtig für Google-Ranking – dies ist der erste Eindruck bei der Suche"
      - name: site_description
        label: "Meta-Beschreibung (für Startseite)"
        type: text
        description: "Die Kurzbeschreibung, die unter dem Titel in den Google-Suchergebnissen erscheint. Sollte in 1-2 Sätzen erklären, was Sie anbieten und wichtige Keywords enthalten. Max. 160 Zeichen."
        hint: "Beeinflusst die Klickrate (CTR) aus den Suchergebnissen erheblich"
      - name: keywords
        label: "SEO-Keywords (durch Komma getrennt)"
        type: text
        description: "Wichtige Begriffe, nach denen Kunden suchen. Werden von Google zwar weniger gewichtet als früher, helfen aber bei der thematischen Einordnung."
        hint: "z.B. Taxi Overath, Mietwagen Bergisch Gladbach, Krankentransport Rhein-Berg, Flughafenfahrt Köln/Bonn"
      - name: og_image
        label: "Vorschaubild (für Facebook/WhatsApp)"
        type: image
        options:
          media: uploads
          categories: [image]
          rename: safe
        description: "👉 KLICKEN Sie auf dieses Feld oder ZIEHEN SIE ein Bild hinein (JPG, PNG, WebP). Empfohlen: 1200×630 Pixel. Dieses Bild erscheint beim Teilen auf Facebook, WhatsApp etc."
        hint: "Ein gutes Vorschaubild erhöht die Klickrate bei Social-Media-Teilungen um bis zu 40%"

  - name: contactdata
    label: Kontaktdaten
    type: file
    path: src/data/contact.json
    format: json
    view:
      primary: company
    fields:
      - name: company
        label: Firmenname
        type: string
      - name: phone
        label: Telefon (mit Leerzeichen)
        type: string
        description: "z.B. 02206 123456 – wird automatisch für alle Telefonlinks auf der ganzen Seite verwendet"
      - name: email
        label: E-Mail-Adresse
        type: string
      - name: whatsapp
        label: WhatsApp-Nummer (international ohne +)
        type: string
        description: "z.B. 492206123456"
      - name: address
        label: Adresse (komplett)
        type: string
      - name: street
        label: Straße + Hausnr.
        type: string
      - name: city
        label: PLZ + Ort
        type: string
      - name: hours
        label: Öffnungszeiten
        type: string
      - name: facebook
        label: Facebook-URL
        type: string
      - name: instagram
        label: Instagram-URL
        type: string
      - name: google_place_id
        label: Google Place ID
        type: string
        description: "Für Google Bewertungen – leer lassen falls nicht bekannt"

  - name: impressum
    label: Impressum
    type: file
    path: src/content/impressum/impressum.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: body
        label: "Inhalt (kompletten Text hier einfügen)"
        type: rich-text
        description: "Hier können Sie den gesamten Impressumstext frei eingeben oder per copy & paste einfügen."

  - name: datenschutz
    label: Datenschutz
    type: file
    path: src/content/datenschutz/datenschutz.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: body
        label: "Inhalt (kompletten Text hier einfügen)"
        type: rich-text
        description: "Hier können Sie den gesamten Datenschutztext frei eingeben oder per copy & paste einfügen."

  - name: hero
    label: Hero Bereich
    type: file
    path: src/content/hero/hero.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Überschrift
        type: string
      - name: subtitle
        label: Untertitel
        type: text
      - name: availability
        label: Verfügbarkeits-Anzeige
        type: string
      - name: highlight_word
        label: Hervorgehobenes Wort (gelb)
        type: string
      - name: cta_primary
        label: CTA Button 1 (Anrufen)
        type: string
      - name: cta_secondary
        label: CTA Button 2 (Kontakt)
        type: string
      - name: phone
        label: Telefonnummer
        type: string
      - name: badges
        label: Badges (unter den Buttons)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: text
            label: Text
            type: string
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - name: clock
                  label: Uhr (24/7)
                - name: location
                  label: Ort (Region)
                - name: years
                  label: Jahre (Seit)

  - name: services
    label: Leistungen
    type: file
    path: src/data/services.json
    format: json
    list: true
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Beschreibung
        type: text
      - name: icon
        label: Icon
        type: select
        options:
          values:
            - { name: "🚕", label: "🚕 Taxi" }
            - { name: "🚙", label: "🚙 Mietwagen" }
            - { name: "🚗", label: "🚗 Auto" }
            - { name: "🚐", label: "🚐 Van/Kleinbus" }
            - { name: "🏥", label: "🏥 Krankentransport" }
            - { name: "🎒", label: "🎒 Schülerfahrt" }
            - { name: "🧸", label: "🧸 KiTa-Fahrt" }
            - { name: "✈️", label: "✈️ Flughafen" }
            - { name: "🚄", label: "🚄 Bahnhof/Zug" }
            - { name: "📦", label: "📦 Kurier/Paket" }
            - { name: "🛣️", label: "🛣️ Fernfahrt" }
            - { name: "❤️", label: "❤️ Gesundheit/Dialyse" }
            - { name: "🧳", label: "🧳 Reise/Gepäck" }
            - { name: "⏰", label: "⏰ Pünktlichkeit" }
            - { name: "⭐", label: "⭐ Service/Premium" }
            - { name: "🏠", label: "🏠 Tür-zu-Tür" }
            - { name: "♿", label: "♿ Behindertengerecht" }
            - { name: "🔄", label: "🔄 Transfer" }
            - { name: "📍", label: "📍 Standort" }
            - { name: "🎯", label: "🎯 Zielort" }
      - name: order
        label: Reihenfolge
        type: number

  - name: about
    label: Über uns
    type: file
    path: src/content/about/about.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: body
        label: Text
        type: rich-text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: milestones
        label: Meilensteine (Zeitleiste)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year}: {text}"
        fields:
          - name: year
            label: Jahr
            type: string
          - name: text
            label: Beschreibung
            type: string

  - name: career
    label: Karriere
    type: file
    path: src/content/career/career.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: subtitle
        label: Untertitel
        type: string
      - name: job_title
        label: Stellenbezeichnung
        type: string
      - name: body
        label: Beschreibung
        type: rich-text
      - name: benefits
        label: Benefits
        type: string
        list: true
      - name: requirements
        label: Anforderungen
        type: string
        list: true
      - name: form_title
        label: Formular-Überschrift
        type: string

  - name: reviews
    label: Bewertungen
    type: file
    path: src/data/reviews.json
    format: json
    list: true
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
      - name: text
        label: Bewertungstext
        type: text
      - name: rating
        label: Sterne
        type: select
        options:
          values:
            - { name: 5, label: "⭐⭐⭐⭐⭐ 5 Sterne" }
            - { name: 4, label: "⭐⭐⭐⭐ 4 Sterne" }
            - { name: 3, label: "⭐⭐⭐ 3 Sterne" }
            - { name: 2, label: "⭐⭐ 2 Sterne" }
            - { name: 1, label: "⭐ 1 Stern" }
      - name: order
        label: Reihenfolge
        type: number

  - name: contact
    label: Kontakt
    type: file
    path: src/content/contact/contact.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Beschreibung
        type: text
      - name: form_heading
        label: Formular-Überschrift
        type: string
