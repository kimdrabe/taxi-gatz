media: public/uploads

settings:
  - name: seo
    label: SEO Einstellungen
    description: "Diese Einstellungen gelten für die gesamte Website und helfen Suchmaschinen, Ihre Seite besser zu verstehen und in den Suchergebnissen weiter oben zu platzieren."
    path: src/data/site.json
    format: json
    fields:
      - name: site_title
        label: "Seitentitel (für Startseite)"
        type: string
        description: "Erscheint als erster Eintrag in den Google-Suchergebnissen. Sollte Hauptkeyword + Ortsname enthalten. Max. 60 Zeichen. Beispiel: Taxi & Mietwagen Gatz – Ihr zuverlässiges Taxi in Overath"
        hint: "Wichtig für Google-Ranking – dies ist der erste Eindruck bei der Suche"
      - name: site_description
        label: "Meta-Beschreibung (für Startseite)"
        type: text
        description: "Die Kurzbeschreibung, die unter dem Titel in den Google-Suchergebnissen erscheint. Sollte in 1-2 Sätzen erklären, was Sie anbieten und wichtige Keywords enthalten. Max. 160 Zeichen."
        hint: "Beeinflusst die Klickrate (CTR) aus den Suchergebnissen erheblich"
      - name: keywords
        label: "SEO-Keywords (durch Komma getrennt)"
        type: text
        description: "Wichtige Begriffe, nach denen Kunden suchen. Werden von Google zwar weniger gewichtet als früher, helfen aber bei der thematischen Einordnung."
        hint: "z.B. Taxi Overath, Mietwagen Bergisch Gladbach, Krankentransport Rhein-Berg, Flughafenfahrt Köln/Bonn"
      - name: og_image
        label: "Social-Media-Vorschaubild (OG Image)"
        type: image
        description: "Dieses Bild erscheint, wenn die Seite auf Facebook, WhatsApp, LinkedIn etc. geteilt wird. Empfohlene Größe: 1200×630 Pixel. Wichtig für einen professionellen Eindruck beim Teilen."
        hint: "Ein gutes Vorschaubild erhöht die Klickrate bei Social-Media-Teilungen um bis zu 40%"

content:

  - name: hero
    label: Hero Bereich
    type: file
    path: src/content/hero/hero.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Überschrift
        type: string
      - name: subtitle
        label: Untertitel
        type: text
      - name: availability
        label: Verfügbarkeits-Anzeige
        type: string
      - name: highlight_word
        label: Hervorgehobenes Wort (gelb)
        type: string
      - name: cta_primary
        label: CTA Button 1 (Anrufen)
        type: string
      - name: cta_secondary
        label: CTA Button 2 (Kontakt)
        type: string
      - name: phone
        label: Telefonnummer
        type: string
      - name: badges
        label: Badges (unter den Buttons)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: text
            label: Text
            type: string
          - name: icon
            label: Icon
            type: select
            options:
              - { label: "Uhr (24/7)", value: clock }
              - { label: "Ort (Region)", value: location }
              - { label: "Jahre (Seit)", value: years }

  - name: services
    label: Leistungen
    type: file
    path: src/data/services.json
    format: json
    list: true
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Beschreibung
        type: text
      - name: icon
        label: Icon (Emoji)
        type: string
      - name: order
        label: Reihenfolge
        type: number

  - name: about
    label: Über uns
    type: file
    path: src/content/about/about.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: body
        label: Text
        type: rich-text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: milestones
        label: Meilensteine (Zeitleiste)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year}: {text}"
        fields:
          - name: year
            label: Jahr
            type: string
          - name: text
            label: Beschreibung
            type: string

  - name: career
    label: Karriere
    type: file
    path: src/content/career/career.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: subtitle
        label: Untertitel
        type: string
      - name: job_title
        label: Stellenbezeichnung
        type: string
      - name: body
        label: Beschreibung
        type: rich-text
      - name: benefits
        label: Benefits
        type: string
        list: true
      - name: requirements
        label: Anforderungen
        type: string
        list: true
      - name: form_title
        label: Formular-Überschrift
        type: string
      - name: form_note
        label: Formular-Hinweis
        type: string

  - name: reviews
    label: Bewertungen
    type: file
    path: src/data/reviews.json
    format: json
    list: true
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
      - name: text
        label: Bewertungstext
        type: text
      - name: rating
        label: Sterne (1-5)
        type: number
      - name: order
        label: Reihenfolge
        type: number

  - name: contact
    label: Kontakt
    type: file
    path: src/content/contact/contact.md
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titel
        type: string
      - name: description
        label: Beschreibung
        type: text
      - name: phone
        label: Telefonnummer
        type: string
      - name: email
        label: E-Mail-Adresse
        type: string
      - name: address
        label: Adresse
        type: string
      - name: hours
        label: Öffnungszeiten
        type: string
      - name: form_heading
        label: Formular-Überschrift
        type: string
